  <body>
    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:hsl(220 20% 94%);color:hsl(222 30% 14%);font-family:Barlow,system-ui,-apple-system,sans-serif;text-align:center;padding:24px">
        <img src="/__l5e/assets-v1/8f811ae1-2fda-42e5-969c-0f1f1e8ce341/chez-mima-logo-readable.png" alt="Chez Mima" style="width:240px;max-width:72vw;height:auto" />
        <div style="width:120px;height:4px;border-radius:4px;background:hsl(220 15% 85%);overflow:hidden"><div style="width:40%;height:100%;border-radius:4px;background:hsl(3 68% 51%);animation:bootbar 1.1s ease-in-out infinite"></div></div>
        <style>@keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}</style>
        <div id="boot-status" style="font-size:13px;opacity:.6">Chargement…</div>
        <button id="boot-repair" type="button" style="display:none;margin-top:8px;padding:12px 20px;border-radius:10px;border:0;background:#c8102e;color:#fff;font-size:16px;font-weight:600">Réparer et recharger</button>
      </div>
    </div>
    <script>
      (function () {
        var showRepair = function (message) {
          if (window.__chezMimaStarted) return;
          var status = document.getElementById("boot-status");
          var button = document.getElementById("boot-repair");
          if (status) status.textContent = message;
          if (button) button.style.display = "inline-block";
        };
        var repair = function () {
          var tasks = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              tasks.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) {}
          Promise.all(tasks).catch(function () {}).then(function () {
            window.location.replace("/?r=" + Date.now());
          });
        };
        document.addEventListener("click", function (e) {
          if (e.target && e.target.id === "boot-repair") repair();
        });
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            showRepair("L’application n’a pas pu se charger.");
          }
        }, true);
        setTimeout(function () {
          showRepair("Le chargement prend trop de temps.");
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
